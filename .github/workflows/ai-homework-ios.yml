name: AI Homework iOS

# Тесты движка решения и сборка установочного файла AIHomework.ipa для iPhone.
# Mac пользователю не нужен: приложение собирается здесь, на облачном macOS-раннере GitHub,
# а .ipa ставится на iPhone с Windows через Sideloadly (см. ai-homework-ios/README.md).
on:
  push:
    branches:
      - 'claude/ai-homework-ios-app-araoag'
    paths:
      - 'ai-homework-ios/**'
      - '.github/workflows/ai-homework-ios.yml'
  workflow_dispatch:

concurrency:
  group: ai-homework-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests (Linux, Swift 6)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ai-homework-ios
        run: swift test

  ipa:
    name: Build AIHomework.ipa (iPhone)
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write   # публикация релиза ai-homework-latest для SideStore
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
      - name: Build for iPhone (unsigned archive)
        working-directory: ai-homework-ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AIHomework.xcodeproj \
            -scheme AIHomework \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/AIHomework.xcarchive \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|\*\* ARCHIVE|^/.*(error|warning):" | sort -u | head -200
      - name: Errors summary
        if: failure()
        working-directory: ai-homework-ios
        run: |
          echo "errors: $(grep -c ' error: ' build.log || true)"
          grep -E " error: " build.log | sort -u | head -150 || true
          tail -20 build.log
      - name: Package .ipa
        working-directory: ai-homework-ios
        run: |
          APP=build/AIHomework.xcarchive/Products/Applications/AIHomework.app
          test -d "$APP"
          ls "$APP/PlugIns" || echo "no extensions embedded"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AIHomework.ipa Payload
          ls -lh AIHomework.ipa
      - name: Upload AIHomework.ipa
        uses: actions/upload-artifact@v4
        with:
          name: AIHomework-ipa
          path: ai-homework-ios/AIHomework.ipa
          retention-days: 30
          if-no-files-found: error
      # Релиз с постоянным адресом: SideStore читает source.json и сам предлагает обновления.
      - name: Publish for SideStore
        if: github.event_name != 'pull_request'
        working-directory: ai-homework-ios
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG=ai-homework-latest
          BASE="https://github.com/$REPO/releases/download/$TAG"
          ICON="https://raw.githubusercontent.com/$REPO/${{ github.sha }}/ai-homework-ios/AIHomework/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          python3 scripts/make_sidestore_source.py \
            --ipa AIHomework.ipa --version "$VERSION" --build "$BUILD" \
            --download-url "$BASE/AIHomework.ipa" --icon-url "$ICON" \
            --source-url "$BASE/source.json" --out source.json
          NOTES="Сборка $VERSION для iPhone (не подписана). Установка через SideStore — см. ai-homework-ios/README.md. Источник SideStore: $BASE/source.json"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" AIHomework.ipa source.json --clobber --repo "$REPO"
            gh release edit "$TAG" --notes "$NOTES" --repo "$REPO"
          else
            gh release create "$TAG" AIHomework.ipa source.json --repo "$REPO" \
              --target "${{ github.sha }}" --prerelease \
              --title "AI Homework — последняя сборка" --notes "$NOTES"
          fi
          echo "SideStore source: $BASE/source.json"
